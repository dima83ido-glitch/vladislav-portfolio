services:
  - type: web
    name: vladislav-portfolio
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run db:migrate && npm run build
    startCommand: npm run start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_SITE_URL
        value: https://vladislav-portfolio.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
